name: Generate Educational PDFs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Build PDFs with Puppeteer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install System Bengali Fonts & FontConfig
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-beng fonts-beng-extra fonts-noto-core fonts-noto-extra fonts-noto-ui-core fontconfig
          mkdir -p ~/.local/share/fonts
          cp fonts/*.ttf ~/.local/share/fonts/
          sudo mkdir -p /usr/share/fonts/truetype/noto
          sudo cp fonts/*.ttf /usr/share/fonts/truetype/noto/
          fc-cache -f -v
          sudo fc-cache -f -v
          echo "Verifying Noto Serif Bengali resolution:"
          fc-match "Noto Serif Bengali"

      - name: Install Dependencies
        run: npm install

      - name: Generate PDFs
        run: node scripts/build_pdfs.js

      - name: Compact & Losslessly Optimize PDFs
        run: python3 scripts/compact_pdfs.py

      - name: Upload PDF Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: es-bangla-pdfs
          path: output_pdfs/*.pdf
          retention-days: 30

      - name: Release PDFs
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: "v1.0.0"
          name: "Es Bangla Educational Notes PDFs"
          draft: false
          prerelease: false
          files: output_pdfs/*.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
